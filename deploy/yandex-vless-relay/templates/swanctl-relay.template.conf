# swanctl-конфиг RELAY-стороны (рендерится в /etc/swanctl/conf.d/relay.conf)
# Relay = IKEv2 EAP-MSCHAPv2 клиент (логин/пароль). Сервер аутентифицируется
# сертификатом (его CA лежит в /etc/swanctl/x509ca/).
#
# БЕЗОПАСНОСТЬ: туннелируем ТОЛЬКО помеченный трафик через mark_in/mark_out.
# IPsec-политика матчится по fwmark __FWMARK__, поэтому SSH/ICMP/IKE сервера
# НИКОГДА не попадают в туннель — сервер не может заблокировать сам себя.
# Relay запрашивает ФИКСИРОВАННЫЙ vIP __RELAY_VIP__ (его же используем для SNAT).

connections {
    relay-to-strongswan {
        version = 2
        remote_addrs = __STRONGSWAN_SERVER_ADDR__
        keyingtries = 0
        rekey_time = 4h
        dpd_delay = 30s
        dpd_timeout = 150s
        encap = yes               # UDP-инкапсуляция (4500) — дружелюбнее к ТСПУ/NAT

        local {
            auth = eap-mschapv2
            eap_id = __EAP_USERNAME__
        }
        remote {
            auth = pubkey          # сервер аутентифицируется сертификатом
            id = __SERVER_ID__      # должно совпадать с SAN серверного сертификата
        }

        children {
            tunnel {
                local_ts  = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                # mark-gated: в туннель идёт только трафик с fwmark __FWMARK__
                mark_in  = __FWMARK__
                mark_out = __FWMARK__
                start_action = start          # НЕ trap (trap может перехватывать широко)
                close_action = restart
                dpd_action = restart
                rekey_time = 1h
                esp_proposals = aes256gcm16-prfsha384-ecp384,aes256-sha256-modp2048
            }
        }
        # Запросить КОНКРЕТНЫЙ виртуальный IP (должен быть в пуле сервера и свободен)
        vips = __RELAY_VIP__
        proposals = aes256gcm16-prfsha384-ecp384,aes256-sha256-modp2048
    }
}

secrets {
    eap-relay {
        id = __EAP_USERNAME__
        secret = "__EAP_PASSWORD__"
    }
}
