# swanctl-конфиг RELAY-стороны (рендерится в /etc/swanctl/conf.d/relay.conf)
# Relay аутентифицируется по PSK (связь сервер↔сервер; не зависит от md4/eap-mschapv2,
# которых нет в Ubuntu 24.04). Сервер по-прежнему проверяется по сертификату (CA в x509ca).
#
# БЕЗОПАСНОСТЬ: туннелируем ТОЛЬКО помеченный трафик через mark_in/mark_out.
# IPsec-политика матчится по fwmark __FWMARK__, поэтому SSH/ICMP/IKE никогда не
# попадают в туннель. Relay запрашивает фиксированный vIP __RELAY_VIP__ (для SNAT).

connections {
    relay-to-strongswan {
        version = 2
        remote_addrs = __STRONGSWAN_SERVER_ADDR__
        keyingtries = 0
        rekey_time = 4h
        dpd_delay = 30s
        dpd_timeout = 150s
        encap = yes               # UDP-инкапсуляция (4500) — дружелюбнее к ТСПУ/NAT

        local {
            auth = psk
            id = __RELAY_IKE_ID__   # IKE-идентичность relay (должна совпасть с сервером)
        }
        remote {
            auth = pubkey          # сервер аутентифицируется сертификатом (LE)
            id = __SERVER_ID__      # SAN серверного сертификата (FQDN)
        }

        children {
            tunnel {
                # local_ts = dynamic -> назначенный vIP (НЕ 0.0.0.0/0!), иначе сервер
                # согласует 0/0===0/0 и заворачивает СВОЙ трафик в туннель → лочит себя.
                local_ts  = dynamic
                remote_ts = 0.0.0.0/0
                mark_in  = __FWMARK__
                mark_out = __FWMARK__
                start_action = start
                close_action = restart
                dpd_action = restart
                rekey_time = 1h
                esp_proposals = aes256-sha256,aes256gcm16,aes128-sha256
            }
        }
        vips = __RELAY_VIP__
        proposals = aes256-sha256-modp2048,aes256gcm16-prfsha384-curve25519,aes128-sha256-modp2048
    }
}

secrets {
    ike-relay {
        id = __RELAY_IKE_ID__
        secret = "__IPSEC_PSK__"
    }
}
