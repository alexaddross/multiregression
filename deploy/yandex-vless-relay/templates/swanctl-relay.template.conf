# swanctl-конфиг RELAY-стороны (рендерится в /etc/swanctl/conf.d/relay.conf)
# Relay = IKEv2 EAP-MSCHAPv2 клиент (логин/пароль), как обычный VPN-юзер.
# Сервер предъявляет сертификат -> его CA лежит в /etc/swanctl/x509ca/ и проверяется.
# Запрашивает vIP из пула сервера, full-tunnel (remote_ts = 0.0.0.0/0), но реально
# в туннель идёт ТОЛЬКО трафик с fwmark __FWMARK__ (charon кладёт маршрут в таблицу __ROUTE_TABLE__).

connections {
    relay-to-strongswan {
        version = 2
        remote_addrs = __STRONGSWAN_SERVER_ADDR__
        keyingtries = 0
        rekey_time = 4h
        dpd_delay = 30s
        dpd_timeout = 150s
        encap = yes               # UDP-инкапсуляция (4500) — дружелюбнее к ТСПУ/NAT

        local {
            auth = eap-mschapv2
            eap_id = __EAP_USERNAME__
        }
        remote {
            auth = pubkey          # сервер аутентифицируется сертификатом
            id = __SERVER_ID__      # должно совпадать с SAN серверного сертификата
        }

        children {
            tunnel {
                local_ts  = dynamic        # станет назначенным vIP
                remote_ts = 0.0.0.0/0       # full-tunnel: весь трафик юзеров на сервер
                start_action = trap|start
                close_action = trap
                dpd_action = restart
                rekey_time = 1h
                esp_proposals = aes256gcm16-prfsha384-ecp384,aes256-sha256-modp2048
            }
        }
        vips = 0.0.0.0             # запросить виртуальный IP, как обычный клиент
        proposals = aes256gcm16-prfsha384-ecp384,aes256-sha256-modp2048
    }
}

secrets {
    eap-relay {
        id = __EAP_USERNAME__
        secret = "__EAP_PASSWORD__"
    }
}
