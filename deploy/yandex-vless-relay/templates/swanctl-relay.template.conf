# swanctl-конфиг RELAY-стороны (этот файл рендерится в /etc/swanctl/conf.d/relay.conf)
# Relay выступает IKEv2-инициатором (road-warrior) к существующему strongSwan-серверу.
# Запрашивает виртуальный IP из пула сервера и строит full-tunnel (remote_ts = 0.0.0.0/0),
# но реально через туннель пойдёт ТОЛЬКО трафик с fwmark __FWMARK__ — за счёт того,
# что charon кладёт маршрут в отдельную таблицу __ROUTE_TABLE__ (см. strongswan override).

connections {
    relay-to-strongswan {
        version = 2
        remote_addrs = __STRONGSWAN_SERVER_ADDR__
        # Переподключение и удержание туннеля
        keyingtries = 0
        rekey_time = 4h
        dpd_delay = 30s
        dpd_timeout = 150s
        encap = yes               # форсируем UDP-инкапсуляцию (NAT/4500) — дружелюбнее к ТСПУ

        local {
            auth = psk
            id = __RELAY_IKE_ID__
        }
        remote {
            auth = psk
            id = __SERVER_IKE_ID__
        }

        children {
            tunnel {
                local_ts  = dynamic        # станет назначенным vIP
                remote_ts = 0.0.0.0/0       # full-tunnel: весь трафик юзеров на сервер
                start_action = trap|start
                close_action = trap
                dpd_action = restart
                rekey_time = 1h
                esp_proposals = aes256gcm16-prfsha384-ecp384,aes256-sha256-modp2048
            }
        }
        # Запросить виртуальный IP у сервера (как обычный VPN-клиент)
        vips = 0.0.0.0
        proposals = aes256gcm16-prfsha384-ecp384,aes256-sha256-modp2048
    }
}

secrets {
    ike-relay {
        id-1 = __RELAY_IKE_ID__
        id-2 = __SERVER_IKE_ID__
        secret = "__IPSEC_PSK__"
    }
}
