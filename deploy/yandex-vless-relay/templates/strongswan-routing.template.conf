# Рендерится в /etc/strongswan.d/99-relay-routing.conf
# КЛЮЧЕВОЕ ИЗМЕНЕНИЕ БЕЗОПАСНОСТИ: charon НЕ устанавливает маршруты и НЕ добавляет
# правило 'from all lookup <table>'. Иначе при подъёме full-tunnel сервер уводит в
# туннель ВЕСЬ свой трафик (включая SSH/ICMP) и блокирует сам себя.
#
# Вместо этого в туннель попадает ТОЛЬКО трафик с fwmark — за счёт mark-gated
# IPsec-политики (mark_in/mark_out в swanctl). vIP на интерфейс ставим (для приёма
# обратного трафика), но маршруты/правила — наша забота, не charon'а.
charon {
    install_routes = no
    install_virtual_ip = yes
}
