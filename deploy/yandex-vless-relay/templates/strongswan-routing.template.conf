# Рендерится в /etc/strongswan.d/99-relay-routing.conf
# Заставляет charon класть маршруты туннеля в ОТДЕЛЬНУЮ таблицу __ROUTE_TABLE__,
# а не в main. Тогда обычный трафик relay (SSH, IKE/ESP, ответы VLESS-клиентам)
# идёт напрямую, а в туннель попадает только то, что мы направим через fwmark.
charon {
    # Ставить маршруты в таблицу __ROUTE_TABLE__ с приоритетом ip-rule
    install_routes = yes
    routing_table = __ROUTE_TABLE__
    routing_table_prio = __ROUTE_TABLE__

    # Не трогаем общесистемный default route
    install_virtual_ip = yes
    install_virtual_ip_on = lo
}
